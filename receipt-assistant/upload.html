<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拍照上传</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:42px 20px;display:flex;flex-direction:column;
  align-items:center;gap:22px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Microsoft YaHei",Arial,sans-serif;background:#f7f8fb;color:#111827
}
h1{margin:0 0 10px;font-size:24px;line-height:1.25;text-align:center}
#file-input{display:none}
#upload-btn{
  width:100%;max-width:360px;min-height:56px;border:0;border-radius:12px;
  background:#2563eb;color:#fff;font-size:18px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 18px rgba(37,99,235,.22)
}
#upload-btn:active{background:#1d4ed8}
#upload-btn:disabled{background:#93c5fd;box-shadow:none}
#progress{display:none;width:100%;max-width:360px}
.bar{height:10px;overflow:hidden;border-radius:999px;background:#dbeafe}
#fill{width:0;height:100%;border-radius:999px;background:#2563eb;transition:width .2s ease}
#progress-text{margin-top:10px;text-align:center;font-size:14px;color:#4b5563}
#message{
  display:none;width:100%;max-width:360px;padding:15px 16px;border-radius:10px;
  text-align:center;font-size:15px;font-weight:700;line-height:1.5
}
#message.ok{display:block;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0}
#message.err{display:block;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca}
</style>
</head>
<body>
<h1>拍照上传签名页</h1>
<input id="file-input" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff" capture="environment" multiple>
<button id="upload-btn" type="button">拍照上传</button>
<div id="progress">
  <div class="bar"><div id="fill"></div></div>
  <div id="progress-text">准备上传</div>
</div>
<div id="message"></div>

<script>
const input = document.getElementById('file-input');
const button = document.getElementById('upload-btn');
const progress = document.getElementById('progress');
const fill = document.getElementById('fill');
const progressText = document.getElementById('progress-text');
const message = document.getElementById('message');

button.addEventListener('click', () => input.click());
input.addEventListener('change', () => uploadFiles(input.files));

function showMessage(type, text) {
  message.className = type;
  message.textContent = text;
}

async function postJson(url, body) {
  try {
    return await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
  } catch (err) {
    return null;
  }
}

async function uploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;

  const batchId = `mobile_${Date.now()}_${Math.random().toString(16).slice(2)}`;
  button.disabled = true;
  message.className = '';
  message.style.display = 'none';
  progress.style.display = 'block';
  fill.style.width = '0%';

  const transportFailedFiles = [];

  await postJson('/api/upload/batch/start', {
    batch_id: batchId,
    selected_count: files.length,
    skipped_files: [],
  });

  for (let i = 0; i < files.length; i++) {
    const fd = new FormData();
    fd.append('file', files[i]);
    fd.append('source', 'mobile');
    fd.append('batch_id', batchId);
    fd.append('original_name', files[i].name);
    progressText.textContent = `上传中 ${i + 1} / ${files.length}`;
    fill.style.width = `${Math.round((i / files.length) * 100)}%`;

    try {
      const resp = await fetch('/api/upload', {method: 'POST', body: fd});
      await resp.json().catch(() => ({}));
    } catch (err) {
      transportFailedFiles.push({original_name: files[i].name});
    }
  }

  const finishResp = await postJson('/api/upload/batch/finish', {
    batch_id: batchId,
    sent_count: files.length,
    transport_failed_files: transportFailedFiles,
  });
  const result = finishResp ? await finishResp.json().catch(() => ({})) : {};

  fill.style.width = '100%';
  progress.style.display = 'none';
  message.style.display = 'block';
  button.disabled = false;
  input.value = '';
  const saved = Number(result.saved_count || 0);
  const skipped = Number(result.skipped_count || 0);
  const failed = Number(result.failed_count || 0);
  const queued = Number(result.queued_count || 0);
  if (result.reconciliation_ok === false) {
    showMessage('err', '上传统计异常，请查看 upload.log');
  } else if (skipped === 0 && failed === 0) {
    showMessage('ok', `本次选择 ${result.selected_count || 0} 张，成功保存 ${saved} 张，加入队列 ${queued} 张，失败 0 张，跳过 0 张`);
  } else {
    showMessage('err', `本次选择 ${result.selected_count || 0} 张，成功保存 ${saved} 张，加入队列 ${queued} 张，失败 ${failed} 张，跳过 ${skipped} 张`);
  }
}
</script>
</body>
</html>
