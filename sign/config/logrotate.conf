# Sign Workbench 日志轮转配置
# 安装：sudo cp logrotate.conf /etc/logrotate.d/sign-workbench
# 测试：sudo logrotate -d /etc/logrotate.d/sign-workbench

/path/to/sign/logs/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  dateext
  dateformat -%Y%m%d
  maxage 90
}
